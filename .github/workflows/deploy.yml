# Builds the site and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# The build fetches the registry and each game's data from the public repos first
# (scripts/fetch-data.mjs, site-config/sources.json), so a release needs no edit here.
name: Deploy site

on:
  push:
    branches: [main]
  # A game's publish Action (or the installer's) sends this after a release:
  #   POST /repos/DioramaVR/dioramavr.github.io/dispatches  {"event_type": "game-release"}
  # (tpm-vr sends game-release for open-beta and stable only; never for closed-beta,
  # because this repo is public and so are its runs and their payloads.)
  repository_dispatch:
    types: [data-updated, game-release]
  # Nightly backstop, and so dated announcements appear and expire on time.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Before the first registry is committed (dvr-installer's sign-registry does that),
  # there is nothing to publish: the run ends green with a note and deploys nothing.
  check:
    # Only main is ever published (release/X.Y.Z branches merge into main to go live),
    # even if someone runs this workflow by hand on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: registry
      - id: registry
        run: |
          if [ -f registry/registry.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No registry/registry.json on main yet, so nothing is deployed. sign-registry commits the first one."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: withastro/action@v6.1.4
        with:
          node-version: "24"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
