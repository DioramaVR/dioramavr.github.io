# Builds the site and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# The build fetches the registry and each game's data from the public repos first
# (scripts/fetch-data.mjs, site-config/sources.json), so a release needs no edit here.
name: Deploy site

on:
  push:
    branches: [main]
  # A game's publish Action (or the installer's) sends this after a release:
  #   POST /repos/DioramaVR/dioramavr.github.io/dispatches  {"event_type": "game-release"}
  # (tpm-vr sends game-release for open-beta and stable only; never for closed-beta,
  # because this repo is public and so are its runs and their payloads.)
  #   game-data: after a game's "Publish game data" run, payload {id, tag} (the new
  #   data zip is in that game's signed index.json, data.url/sha256/size/date); also
  #   after "Publish assets" in dvr-game-assets (the media list is in index.json: assets).
  #   Both also call workflow_dispatch, which is what reliably starts this.
  #   data-updated: after the registry changes (sign-registry, publish-installer).
  repository_dispatch:
    types: [data-updated, game-release, game-data]
  # Nightly backstop, and so dated announcements appear and expire on time.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      announce:
        description: "Discord: post new releases (off: only show what would be posted)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Before the first registry is committed (dvr-installer's sign-registry does that),
  # there is nothing to publish: the run ends green with a note and deploys nothing.
  check:
    # Only main is ever published (release/X.Y.Z branches merge into main to go live),
    # even if someone runs this workflow by hand on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: registry
      - id: registry
        run: |
          if [ -f registry/registry.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No registry/registry.json on main yet, so nothing is deployed. sign-registry commits the first one."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: withastro/action@v6.1.4
        with:
          node-version: "24"
      # The registry and indexes this build checked and shows, for the announce job.
      - uses: actions/upload-artifact@v4
        with:
          name: release-data
          path: |
            data/registry.json
            data/games/*/index.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  # Discord: one message for each public release (open-beta or stable game release, or an
  # installer release) the site now shows that hasn't been announced yet, after it's live.
  # scripts/announce.mjs decides; what's been announced is kept in announced.json on the
  # discord-announced branch (no site code there), saved before anything is posted, so a
  # release is never posted twice. Closed betas never reach an index, and data-only
  # publishes, dry runs and failed runs add no release, so none of them announce.
  # Without the DISCORD_WEBHOOK_URL secret, or with announce off, it only shows the messages.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the discord-announced branch only
    env:
      PREVIEW: ${{ github.event.inputs.announce == 'false' && '--preview' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: release-data
          path: data
      - name: What's been announced
        run: |
          mkdir -p state
          if git fetch -q --depth 1 origin discord-announced 2>/dev/null; then
            git show FETCH_HEAD:announced.json > state/announced.json
            git rev-parse FETCH_HEAD > state/parent
          fi
      - name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/announce.mjs releases --data data --state state/announced.json --out state/messages.json
      - name: Save what's announced (before posting)
        if: env.PREVIEW == ''
        run: |
          if [ -f state/parent ] && git show "$(cat state/parent):announced.json" | cmp -s - state/announced.json; then
            echo "nothing new to save"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w state/announced.json)
          tree=$(printf '100644 blob %s\tannounced.json\n' "$blob" | git mktree)
          parent=(); [ -f state/parent ] && parent=(-p "$(cat state/parent)")
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "Announced on Discord (deploy run $GITHUB_RUN_ID)")
          git push -q origin "$commit:refs/heads/discord-announced"
      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/announce.mjs send --messages state/messages.json $PREVIEW
